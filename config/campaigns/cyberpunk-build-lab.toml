[campaign]
id = "cyberpunk-build-lab"
name = "Cyberpunk Build Lab"
game_system = "Cyberpunk RED"
language = "es"
description = """
Sesion de charla casual para ayudar a Miquel a decidir que personaje crear
para la proxima partida de Cyberpunk. El tono es de colegas: bromas, propuestas
de builds y comparaciones de roles.
"""
campaign_summary = """
# Crónica de Cyberpunk Build Lab: La Búsqueda del Personaje de Miquel

## Naturaleza de la campaña

Esta no es una aventura activa, sino una serie de sesiones de pre-juego entre colegas cuyo objetivo declarado es ayudar a Miquel a definir concepto y rol para su próximo personaje en una partida de Cyberpunk RED. El tono es distendido, con bromas constantes, propuestas descartadas sobre la marcha y digresiones típicas de mesa de amigos. Escalopo ejerce de Director de Juego aportando contexto de mundo (la ciudad de **Santiago**, con cuatro facciones definidas y zonas grises entre ellas); Zartch actúa como una especie de fixer narrativo del grupo, lanzando ideas y conectando conceptos; Bateman pone a prueba los límites con propuestas agresivas o extrañas.

## Arco 1: El caos técnico (Sesiones 1 y 2)

Las dos primeras sesiones quedaron prácticamente inutilizadas por fallos graves de conexión y transcripción. La Sesión 1 fue un desastre casi total: el sistema registró ruido incoherente y ninguna conversación sustancial sobre builds llegó a producirse, más allá de la frustración compartida (especialmente de Miquel) y el humor negro de Zartch sobre las alucinaciones del transcriptor.

La Sesión 2, aunque más fructífera, siguió lastrada por problemas de comunicación de Miquel. Aun así, dejó las primeras semillas del proceso: Miquel presentó **tres conceptos iniciales**:

1. **Ejecutivo Corporativo** — tiburón empresarial cínico, estilo "American Psycho" sin la psicopatía, que quiere "ser el más listo de la clase".
2. **Netrunner Antisistema** — anarquista digital, opuesto a cualquier forma de poder opresivo, movido por un espíritu punk genuino.
3. **Ronin Corporativo** — ex-samurai corporativo sin señor, traumatizado por atrocidades presenciadas en labores de seguridad, alejado del mundo digital, en busca de justicia difusa contra las corporaciones.

Se discutió extensamente el concepto ejecutivo, con digresiones sobre tecno-feudalismo, la "PayPal Mafia" y élites segregacionistas (aportación de Zartch), y se usó como referencia recurrente a una **ejecutiva poliooperada de 160 años que aparenta 20**. Escalopo insistió en anclar cualquier concepto a una posición concreta dentro de Nine City (corporación grande tipo Zigurat vs. empresa pequeña) y advirtió que los contactos de otros jugadores (Pater, Dennis) podrían encajar con concesiones. Quedó abierta la duda de si Miquel quería o no un trasfondo militar tipo "cabronazo".

## Arco 2: Definición del concepto (Sesión 3) — el núcleo productivo

Esta fue la sesión más resolutiva. Miquel pivotó lejos del ejecutivo duro hacia la idea de montar **"su negociete"**: una startup entre cuatro colegas, sin grandes aspiraciones corporativas clásicas.

**Exploración de roles:**
- Zartch identificó que esto encajaba más con **Fixer** que con Ejecutivo.
- Miquel tanteó **Media** ("pixel"), pero lo rechazó categóricamente poco después (no quiere hacer de influencer).
- Se valoró el rubro del negocio: **software** (infraestructura, seguridad, incluso software para rifles inteligentes).
- Surgió la idea de trabajar como **subcontratistas**, y la posible relación con la corporación **Aterna**, descartada por Escalopo debido a sus condiciones extremas (renuncia a la humanidad, transhumanismo total, "el humano está caduco").
- Se probaron y descartaron conceptos como "Reservoir Dogs" (escuadrón de limpieza especializado), **Rockero/influencer**, **Periodista** y **Nómada** (aunque Escalopo señaló que el Nómada "es muy de startup" como chico para todo).

**Jerarquía de preferencias de Miquel:**
1. Técnico (el más atractivo)
2. Nómada
3. Periodista (el que menos)

**Motivación central revelada:** Miquel quiere un personaje que "trepe en los eslabones sociales", que busque controlar el cotarro y depredar en la cadena alimenticia — un rol ambicioso y agresivo.

**Idea de complementariedad (yin-yang):** Miquel propuso que su personaje ambicioso y "hambriento" se equilibre con un netrunner más relajado y social (posiblemente el propio Zartch), generando una dinámica de contraste dentro del grupo.

**Solución de compromiso — Ejecutivo con startup paralela:** Zartch propuso la idea que finalmente cuajó: Miquel sería un **ejecutivo de una gran corporación (ej. Arasaka)** que en paralelo desarrolla en secreto su propia startup de software/realidad aumentada, con la esperanza de independizarse algún día. Esto le permite mantener las skills mecánicas del rol Ejecutivo (que requieren estructura corporativa real para funcionar, según explicó Escalopo) sin renunciar a la narrativa emprendedora.

**Detalles mecánicos aclarados por Escalopo:**
- Ser ejecutivo y tener empresa propia **sí son compatibles**.
- La empresa propia empezaría con **Recursos nivel 1**, mejorable con inversión de puntos, pero nunca al nivel de una corporación media.
- Estructura inicial modesta: secretaria, comerciales a comisión, personal de apoyo (mención cómica a un empleado octogenario que no puede jubilarse).
- Diferenció Arreglador (freelancer con contactos) de Ejecutivo (poder real dentro de estructura corporativa).

**Concepto final consolidado de la sesión:** Una startup tecnológica familiar con toque vintage (se menciona una máquina Olivetti de los años 40 combinada con tecnología moderna), donde Miquel ejerce de operativo de campo/comercial mientras un **CEO-becario** (posiblemente su cuñado, aún estudiando la carrera) gestiona la administración a cambio de sueldo bajo y promesa de acciones futuras.

**Advertencia narrativa de Escalopo:** las startups exitosas atraen la atención de corporaciones mayores, con riesgo de ser absorbidas "por las buenas o por las malas". Recomienda mantener perfil bajo y tapaderas múltiples. Zartch sugirió sectores discretos como una empresa de limpieza/recogida de basuras como posible tapadera o giro de negocio.

*(Nota: Bateman se desconectó antes de que terminara de cerrarse esta sesión).*

## Arco 3: Salto inesperado a la partida real (Sesión 4)

Contra lo esperado, esta sesión no continuó el proceso de build de Miquel. En su lugar, la conversación derivó hacia la logística y ambientación de una partida real ya en marcha:

- Aparece **Davidus**, jugador no registrado previamente, con asistencia incierta por vacaciones; tanto él como Bateman avisan que probablemente faltarán la semana siguiente.
- Escalopo comparte **mapas** de la próxima sesión, que ilusionan a Zartch (quien fantasea con verlos en Roll20 actualizándose dinámicamente).
- Se mencionan unos **planos** de un lugar vinculado a **Denis**, sobre quien se comenta con humor negro que ha hecho "reformas" cuestionables, lo que obligará presumiblemente a contratar gente para arreglar los destrozos.
- Escalopo desliza un apunte narrativo sin desarrollar: resulta extraño que un patrón/jefe avise en persona de que "tarda" en algo — posible gancho de trama futuro.
- Dato geográfico clave: la próxima sesión arranca en un **hotel situado en Coastview, dentro de Pacifica** (el distrito más cercano a Night City para quienes conocen el videojuego de referencia).

No hubo ninguna referencia a builds, roles, la ejecutiva poliooperada ni al ripperdoc de confianza. La sesión se cortó abruptamente dejando sin resolver tanto la agenda del grupo como los ganchos narrativos plantados.

## Estado actual de la trama

**Decisión de personaje de Miquel:** No cerrada del todo, pero con fuerte consenso de trabajo:
- **Rol:** Ejecutivo (posiblemente de una gran corporación tipo Arasaka), compatibilizado mecánicamente con la propiedad de una startup tecnológica paralela.
- **Concepto:** Startup familiar de software/hardware con estética vintage-moderna, estructura mínima (CEO-becario + comerciales a comisión), Miquel como operativo comercial de campo.
- **Motivación:** ambición de ascenso social y control, equilibrada narrativamente por un compañero netrunner más relajado (posible sinergia con Zartch).
- **Pendiente:** decidir si mantiene vínculo con Aterna (probablemente descartado), definir el sector final de la empresa (software, seguridad, o tapadera tipo limpieza/basuras) y pulir detalles de recursos y contactos.

**Trama emergente (aún sin desarrollar):** el misterio del patrón que "tarda", las reformas de Denis en un lugar por identificar, y el hotel de Coastview (Pacifica) como punto de partida geográfico de la próxima sesión jugada. Queda abierta la duda de si la charla de build para Miquel se retomará antes de que arranque la partida real o si quedó definitivamente sustituida por el inicio de la aventura.
"""

