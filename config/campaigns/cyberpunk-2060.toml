name = "Cyberpunk 2060: Nacimiento de la Perfeccion"
game_system = "Cyberpunk RED"
language = "es"
description = "Night City, 2060. La contaminacion de la explosion de la torre Arasaka ha sido limpiada y la ciudad empieza a reconstruirse. Pero no es la vieja Night City la que resurge: Aeterna Biotics, una startup agresiva que promete inmortalidad, esta transformando la ciudad desde dentro. Su lema: \"La carne es un lastre; nosotros somos la evolucion\". Mientras las megas tradicionales luchan por no quedar obsoletas, los jugadores viven la metamorfosis de Night City hacia algo que podria ser el futuro de Cyberpunk 2077... o no."
campaign_summary = """
# CYBERPUNK 2060: NACIMIENTO DE LA PERFECCIÓN
## Crónica de Node 56 — Resumen Global de Campaña

---

## PRÓLOGO: LA PLAZA DE WATSON

Todo comenzó en una plaza de Watson, donde cuatro desconocidos convergieron sin saberlo en el mismo evento: **Elara "Nix" Navarro**, fixer de información; **Vektor**, netrunner parco y analítico; **Canal**, técnico de humor negro y gatillo fácil; y una misteriosa mercenaria europea que resultaría ser **Tira**. Un intercambio de un disco de datos entre una nómada (**Sena**) y un fixer se vio interrumpido por la llegada de drones blancos de **Aeterna**, que instalaron una antena y desataron un **nodo de silencio**: once personas se disolvieron en charcos de cristal líquido, el mundo se volvió blanco absoluto, y los supervivientes experimentaron visiones ajenas —accidentes de tráfico, explosiones en Panamá, ejecuciones corporativas— que resultarían ser fragmentos de un pasado compartido y manipulado.

Al despertar, los cuatro descubrieron líneas verdes que los conectaban en la **Capa 3 de la Red**, un vínculo creado por un misterioso netrunner que los protegió del evento. Habían nacido como **Node 56**, marcados por una barra de progreso invisible que Aeterna usa para medir cuánto saben de ellos antes de "reemplazarlos".

---

## ARCO I: LOS ORÍGENES FAMILIARES

La investigación del disco robado —perteneciente a **John Trash**— reveló que Aeterna no es una simple corporación tecnológica, sino la culminación de décadas de manipulación. **Sena**, la nómada, resultó ser la hermana de **Kael**, ambos hijos de **Marek Strut**, contrabandista que operaba junto a **Elías Serrano** (padre de Canal) y el misterioso **Tomás "Rizo" Varela**, traficando tecnología robada a Aeterna por dos rutas: una en Panamá, otra europea bajo la **Doctora Heller**. El ataque al **carguero de Gracia Biotech en 2054** marcó a Canal, Sena y Kael, arrebatándoles a sus familias.

En una escena explosiva (literalmente), Canal reveló a Sena que era su padre, desencadenando una pelea fraternal entre Sena y Kael tras descubrirse que este último la había drogado para forzar una confrontación con la verdad. La reconciliación entre las familias de Canal y los hermanos nómadas se completó sesiones después, cuando Kael se disculpó al descubrir que nunca fueron enemigos, sino socios traicionados.

Paralelamente, Vektor descubrió que su madre, co-creadora de software de control de tráfico para **Danger Gal**, fue asesinada por Aeterna tras descubrir que su trabajo se usó para eliminar a la **familia Falkenberg** mediante "accidentes". **Erik Falkenberg** resultó ser el arquitecto involuntario de los nodos de silencio, y su hija desaparecida, **Alina**, no era otra que **Tira**. La familia de Tira había sentado las bases tecnológicas de las antenas que Aeterna pervirtió, y sus padres fueron asesinados al descubrirlo.

Nix, por su parte, fue advertida de una posible conexión genética con **Johnny Silverhand** por Sierra, un hilo aún sin resolver.

---

## ARCO II: EKATERINA, SIERRA Y LA RESISTENCIA

**Ekaterina**, una mujer elegante que lidera una red de resistencia desde su mansión en Westbrook, se presentó como protectora de más de cincuenta supervivientes de Aeterna, motivada por la pérdida de su marido e hijo. Reveló la existencia de **Cerberus**, una IA de contrainteligencia creada por Militech, y de **SoulKiller**, la IA de Arasaka que devastó la Red original en 2023, ambas vinculadas al **Proyecto Cinasur/Océano Sur**: un esfuerzo encubierto de Militech (IA), Aeterna (desarrollo neurológico) y Arasaka (cuerpos/"cascarones") para crear inteligencias híbridas.

**Sierra**, netrunner escuálida aliada de la legendaria **Alt Cunningham** (atrapada tras el Muro Negro), reveló que Aeterna clona biológicamente a sus objetivos al alcanzar el 100% de "recopilación de datos", sustituyendo originales por copias mejoradas. Explicó que existen **tres fragmentos de IA** sueltos: uno en el fallecido Dr. Falkenberg, otro en un implante de Sena, y un tercero en la columna vertebral de Tira —tecnología que actúa como antena de la "comunicación blanca" de Aeterna (frecuencia 56/47-16-76, descifrada por Canal a partir del "Patrón 71").

La alianza con Sierra se tensó cuando se reveló que Ekaterina ordenó su asesinato: un ataque a tiros en un piso franco de Watson que el grupo repelió, salvando a Sierra in extremis (gracias a Nix) y enviándola a un hospital de élite, el **Rocklin Augmentix Campus**, donde recibió tratamiento "Platinum" pagado por un patrocinador desconocido. Sierra, al despertar, negó conocer el motivo de la traición de Ekaterina más allá de una disputa ideológica: ella busca redimir la tecnología de Aeterna; Ekaterina, controlarla y monetizarla.

Sierra confesó haber sido amiga de la madre de Vektor, ambas interesadas en el Proyecto Cinasur, lo que costó la vida de esta última. También reveló que el impostor que se reunió con Tira haciéndose pasar por **Elías Thorne** era una creación de Aeterna —el verdadero Thorne fue asesinado— y que el **Falso Elías Thorne** manipulaba a Tira con una agenda propia.

---

## ARCO III: EL BÚNKER DE CINASUR

La investigación de un solar en disputa en Pacífica (entre el ayuntamiento, una constructora fantasma y una corporación sin nombre) llevó al grupo a descubrir una entrada sellada de **Militech**. Tras sobrevivir a un ataque de la **NUSA** contra la banda local **Calle 6** —que escaló a un bombardeo aéreo con cazas de combate sobre todo el solar—, el grupo exploró el búnker subterráneo: niveles con reactor nuclear sellado, laboratorios herméticos infranqueables, y una planta -5 con una masacre inexplicable (cuerpos destrozados por fuerza sobrehumana, ratas aplastadas en patrones deliberados). Algo —posiblemente Cerberus, convertido en guardián hostil tras descubrir que Aeterna financiaba en paralelo el "soldado universal" de Arasaka— se arrastraba en las profundidades.

Sierra confirmó que **Alt Cunningham** fue rescatada del Muro Negro por una IA de Militech, pero quedó atrapada en ese mismo búnker, desde donde sabotea activamente cualquier intento de ser liberada o localizada. El grupo, perseguido ahora por la NUSA como terroristas (aunque misteriosamente removido de las listas prioritarias de búsqueda por fuerzas desconocidas), posee información sobre la ubicación del búnker que podría negociar con Ekaterina, Thompson o la propia Sierra.

---

## ARCO IV: LA RED DE CIVILES Y LA GUERRA INFORMATIVA

El grupo descubrió que Aeterna ha convertido a ciudadanos comunes —seducidos por la moda de sus implantes "limpios"— en una **red de repetidores inconscientes** que extiende su alcance de comunicación por toda Night City. Nix mapeó el panorama mediático: **Lillet-Thompson** lidera el periodismo de resistencia (con una cita pendiente en el Afterlife), mientras **Inés Alcázar** abandera la propaganda pro-Aeterna; todo periodista crítico que ha investigado a fondo ha muerto en "accidentes".

---

## ESTADO ACTUAL DE LA TRAMA

Node 56 se encuentra en una encrucijada crítica:

- **Confianza fracturada**: Ekaterina ha demostrado ser una amenaza real tras ordenar la muerte de Sierra; la alianza con la resistencia está en duda.
- **El hilo de Bessa Rogge**: Vektor propone contactar a esta antigua amiga de Johnny Silverhand y Alt Cunningham como nueva fuente de información sobre el Muro Negro y Cerberus.
- **Familias recompuestas**: Canal, Sena y Kael han descubierto que sus padres fueron socios, no enemigos, en el contrabando contra Aeterna. El paradero de Elías Serrano (padre de Canal) sigue siendo un misterio, mientras que **Rizo** está localizado en Night City y la **Doctora Heller** permanece como fantasma.
- **John Trash hallado, pero roto**: El grupo localizó finalmente a John Trash en un campamento Aldecaldo de las Badlands, solo para encontrarlo mentalmente ausente ("ido", con pupilas vacías) y custodiado por un hombre de capacidad de combate sobrehumana que derrotó a Tira con facilidad. La escena degeneró en una tensa encrucijada: Sena empuñando un arma oculta, nómadas armados rodeando la zona, y las respuestas que todos buscaban quizás perdidas en la mente ausente de Trash.
- **Clara Ionescu**: posible aliada o víctima retenida en Danger Gal (filial de Arasaka), vinculada a la tecnología de neurodanza original.
- **El fragmento de IA de Tira**: Sierra propuso un intercambio por el fragmento alojado en el implante espinal de Tira, con Vektor como custodio neutral de la negociación, aún sin resolver.
- **Barras de progreso**: el grupo permanece peligrosamente cerca del 88-100%, con Vektor intentando revertirlas mediante el software heredado de Sierra.

En las calles de Night City, donde el polímero blanco de Aeterna sigue devorando el carbón y el óxido del viejo mundo, Node 56 camina sobre una cuerda floja entre facciones que los usan como peones: la resistencia de Ekaterina, la agenda personal de Sierra, las megacorporaciones tradicionales relegadas a las sombras, y la propia Aeterna, que los observa, los mide, y espera el momento de alcanzar el 100%.
"""

